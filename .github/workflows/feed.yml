name: Atualizar notícias/normas e publicar

on:
  schedule:
    # 06:10, 09:10, 12:10, 15:10 e 18:10 (horário de Brasília)
    - cron: "10 9,12,15,18,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar feed (notícias, normas e indicadores)
        if: github.event_name != 'push'
        run: python3 scripts/update_feed.py

      - name: Salvar feed no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "rotina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "Sem novidades."
          else
            git commit -m "feed: atualização automática"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
